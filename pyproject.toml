[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "novel-lens"
version = "0.1.0"
description = "小说分析与创作知识服务"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "python-multipart>=0.0.20,<1",
    "mcp>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/novel_lens"]

[tool.hatch.build.targets.sdist]
# 防止临时目录中的嵌套配置样例被 Git 忽略规则的反向匹配重新纳入源码包。
exclude = ["/tmp/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
