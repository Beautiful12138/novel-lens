<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovelLens · 看见文字里的世界</title><link rel="stylesheet" href="experience.css?v=live-1"><link rel="stylesheet" href="live.css"></head>
<body class="live-data">
<svg class="svg-defs" aria-hidden="true"><defs>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="M20 12H5m6-6-6 6 6 6"/></symbol>
<symbol id="expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></symbol>
<symbol id="lens" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><path d="M10 5v22M22 5v22M10 16h12"/></symbol>
</defs></svg>
<a class="skip" href="#experience">跳到作品</a>
<header class="app-header"><a class="brand" href="./"><svg><use href="#lens"/></svg><span>NovelLens</span></a><span class="header-purpose">让理解，回到文字之中。</span><div class="header-end"><span>真实数据 · 只读预览</span><a href="demo.html">演示样例<svg><use href="#arrow"/></svg></a></div></header>
<main id="experience" class="experience">
  <section class="intro" aria-labelledby="work-title">
    <div class="title-wrap"><h1 id="work-title">正在连接</h1><span class="title-rule" aria-hidden="true"></span></div>
    <p class="work-meta" id="work-meta">读取作品信息…</p>
    <blockquote id="work-quote"></blockquote>
    <button id="read-toggle" class="read-toggle" aria-pressed="false"><span>展开阅读</span><svg><use href="#arrow"/></svg></button>
    <button id="annotation-toggle" class="annotation-toggle" aria-expanded="true" aria-controls="analysis annotation-picker"><svg><use href="#lens"/></svg><span>收起标注</span></button>
    <div class="intro-foot"><span class="work-position" id="work-position">01 <span>/ 02</span></span><span id="work-state">连接业务服务中…</span></div>
  </section>
  <section class="stage" aria-label="原文与标注探索区">
    <div class="stage-heading"><span id="stage-heading">正在加载原文与标注</span><span class="mode-label" id="mode-label">探索视图</span></div>
    <div class="orbit" aria-hidden="true"><span></span><span></span><i></i></div>
    <div class="back-sheet" aria-hidden="true"><div class="back-title">文字<br>之间</div><span>NovelLens</span></div>
    <article class="source-sheet" id="source-sheet" aria-labelledby="chapter-title">
      <header class="sheet-header"><span>原文</span><select id="section-select" aria-label="选择章节"></select></header>
      <h2 id="chapter-title">原文</h2>
      <div class="source-scroll" id="source-scroll" tabindex="0" aria-label="原文段落"></div><div class="source-pagination"><button id="previous-source">上一页</button><span id="source-page-label"></span><button id="next-source">下一页</button></div>
      <footer class="sheet-footer"><span id="source-caption"></span><button id="chapter-start">阅读整章</button><button id="source-expand" aria-label="展开原文阅读"><svg><use href="#expand"/></svg></button></footer>
    </article>
    <svg class="reference-line" id="reference-line" aria-hidden="true"><path id="connection"/><circle id="connection-dot" r="4"/></svg>
    <aside class="analysis" id="analysis" aria-label="当前分析标注">
      <div class="analysis-head"><button id="browse-marks">浏览标注</button><span id="annotation-position"></span></div>
      <h2 id="annotation-title">标注详情</h2>
      <p id="annotation-note"></p>
      <div class="annotation-tags" id="annotation-tags"></div><label class="reference-control">引用位置<select id="reference-select" aria-label="选择引用位置"></select></label>
      <button class="locate" id="locate">在原文中查看<svg><use href="#arrow"/></svg></button>
    </aside>
    <div class="annotation-picker" id="annotation-picker"><button id="previous-mark">上一条</button><button id="next-mark">下一条</button><button id="open-marks">全部标注</button></div>
    <p class="stage-instruction" id="stage-instruction"><svg><use href="#lens"/></svg>浏览标注列表，查看完整说明和全部引用。</p>
  </section>
</main>
<footer class="work-switcher"><label>作品库<select id="work-select" aria-label="选择作品"></select></label><button id="more-works" hidden>加载更多作品</button><span id="catalog-summary"></span></footer>
<section id="catalog-drawer" hidden aria-labelledby="drawer-title"><header><h2 id="drawer-title">作品标注</h2><button id="close-drawer">关闭</button></header><div class="drawer-tools"><span id="marks-scope-label">整部作品 · 有效标注</span><button id="all-marks">整部标注</button></div><button id="marks-page-scope">查看当前原文页的标注</button><div id="mark-list"></div><footer><button id="previous-marks">上一页</button><span id="mark-page-label"></span><button id="next-marks">下一页</button></footer></section>
<div id="network-status" role="status"><span id="network-message">正在连接服务…</span><button id="retry" hidden>重试</button></div>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<script src="live.js"></script>
</body></html>
