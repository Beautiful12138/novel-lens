<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovelLens · 看见文字里的世界</title><link rel="stylesheet" href="experience.css?v=title-open"></head>
<body>
<svg class="svg-defs" aria-hidden="true"><defs>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="M20 12H5m6-6-6 6 6 6"/></symbol>
<symbol id="expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></symbol>
<symbol id="lens" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><path d="M10 5v22M22 5v22M10 16h12"/></symbol>
</defs></svg>
<a class="skip" href="#experience">跳到作品</a>
<header class="app-header"><a class="brand" href="./"><svg><use href="#lens"/></svg><span>NovelLens</span></a><span class="header-purpose">让理解，回到文字之中。</span><div class="header-end"><span>交互视觉提案</span><a href="../studio/">上一版<svg><use href="#arrow"/></svg></a></div></header>
<main id="experience" class="experience">
  <section class="intro" aria-labelledby="work-title">
    <div class="title-wrap"><h1 id="work-title"><span>雨停</span><span>之前<span class="title-stop">。</span></span></h1><span class="title-rule" aria-hidden="true"></span></div>
    <p class="work-meta" id="work-meta">正文 · 2 章</p>
    <blockquote id="work-quote">“米泡上了。”</blockquote>
    <button id="read-toggle" class="read-toggle" aria-pressed="false"><span>展开阅读</span><svg><use href="#arrow"/></svg></button>
    <button id="annotation-toggle" class="annotation-toggle" aria-expanded="true" aria-controls="analysis annotation-picker"><svg><use href="#lens"/></svg><span>收起标注</span></button>
    <div class="intro-foot"><span class="work-position" id="work-position">01 <span>/ 02</span></span><span id="work-state">原文可读 · 索引已就绪</span></div>
  </section>
  <section class="stage" aria-label="原文与标注探索区">
    <div class="stage-heading"><span id="stage-heading">原文与标注，在此相遇。</span><span class="mode-label" id="mode-label">探索视图</span></div>
    <div class="orbit" aria-hidden="true"><span></span><span></span><i></i></div>
    <div class="back-sheet" aria-hidden="true"><div class="back-title">文字<br>之间</div><span>NovelLens</span></div>
    <article class="source-sheet" id="source-sheet" aria-labelledby="chapter-title">
      <header class="sheet-header"><span>原文</span><span id="chapter-count">第一章 / 共两章</span></header>
      <h2 id="chapter-title">留下的伞</h2>
      <div class="source-scroll" id="source-scroll" tabindex="0" aria-label="原文段落"></div>
      <footer class="sheet-footer"><span id="source-caption">引用范围 · 第 3–5 段</span><button id="source-expand" aria-label="展开原文阅读"><svg><use href="#expand"/></svg></button></footer>
    </article>
    <svg class="reference-line" id="reference-line" aria-hidden="true"><path id="connection"/><circle id="connection-dot" r="4"/></svg>
    <aside class="analysis" id="analysis" aria-label="当前分析标注">
      <div class="analysis-head"><span>标注</span><span id="annotation-position">01 / 02</span></div>
      <h2 id="annotation-title">答非所问</h2>
      <p id="annotation-note"></p>
      <div class="annotation-tags" id="annotation-tags"></div>
      <button class="locate" id="locate">在原文中查看<svg><use href="#arrow"/></svg></button>
    </aside>
    <div class="annotation-picker" id="annotation-picker" role="group" aria-label="选择分析标注"></div>
    <p class="stage-instruction" id="stage-instruction"><svg><use href="#lens"/></svg>将鼠标移到标注上，探索对应原文。</p>
  </section>
</main>
<footer class="work-switcher">
  <span class="switcher-label">你的作品</span>
  <div class="work-tabs" role="group" aria-label="切换作品">
    <button class="work-tab" data-work="rain" aria-pressed="true"><span class="mini-cover rain-mini" aria-hidden="true"></span><span>雨停之前<small>2 章 · 正文</small></span><svg><use href="#arrow"/></svg></button>
    <button class="work-tab" data-work="night" aria-pressed="false"><span class="mini-cover night-mini" aria-hidden="true"></span><span>夜班归途<small>1 章 · 正文</small></span><svg><use href="#arrow"/></svg></button>
  </div>
  <p>虚构样例 · 未连接业务数据<br><span>标注与引用来自既有演示内容</span></p>
</footer>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<script src="experience.js"></script>
</body></html>
