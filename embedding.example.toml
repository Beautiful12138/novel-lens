schema_version = 1
model_contract = "qwen3-embedding-0.6b-q8_0-v1"
executable = "data/embedding/runtime/llama-server.exe"
model_path = "data/embedding/models/Qwen3-Embedding-0.6B-Q8_0.gguf"
backend = "cpu"
device = "none"
threads = 4
threads_batch = 4
context_tokens = 4096
port = 18081

