name: novel-lens

services:
  postgres:
    # 固定已验证的官方 PostgreSQL 18.6 镜像，更新时重新验证并替换摘要。
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: novel-lens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: novel_lens
      POSTGRES_USER: novel_lens
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # PostgreSQL 18 的数据卷挂载点包含主版本子目录。
      - postgres-data:/var/lib/postgresql
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
    name: novel-lens-postgres-data

secrets:
  postgres_password:
    file: ./data/postgres/password
