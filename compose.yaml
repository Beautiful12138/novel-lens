name: novel-lens

services:
  postgres:
    # 本地构建的 PostgreSQL 18.6 + PGroonga 4.0.8；固定已验证镜像 ID。
    # 部署前须加载归档或按 docker/postgres/Dockerfile 构建并核验镜像 ID。
    image: sha256:47f74d7d5cfe59f960726a56541515801ed4ee3183fad8bb9ef899e5d9ced32b
    pull_policy: never
    container_name: novel-lens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: novel_lens
      POSTGRES_USER: novel_lens
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - "10002:5432"
    # 数据库使用 SCRAM 密码认证，关闭 TLS；客户端使用 sslmode=disable。
    command:
      - postgres
      - -c
      - ssl=off
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - ./data/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # PostgreSQL 18 的数据卷挂载点包含主版本子目录。
      - postgres-data:/var/lib/postgresql
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
    name: novel-lens-postgres-data

secrets:
  postgres_password:
    file: ./data/postgres/password
