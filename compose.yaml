# 新建本机实例，不复用旧版服务器的 novel-lens-postgres-data 卷。
name: novel-lens-local

services:
  postgres:
    # 从公开基础镜像构建，无需维护者的镜像归档或本地镜像 ID。
    build: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: novel_lens
      POSTGRES_USER: novel_lens
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      # PostgreSQL 18 的数据卷挂载点包含主版本子目录。
      - postgres-data:/var/lib/postgresql
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ./data/postgres/password
